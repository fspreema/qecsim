[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qecsim"
version = "0.1.0"
description = "Quantum error correction and lattice surgery tools"
authors = [{ name = "Fabian Spreemann", email = "f.spreemann@fz-juelich.de" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.24",
  "pymatching>=2.0",
]

[tool.setuptools]
packages = ["qecsim"]